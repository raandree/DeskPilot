# ContinuousDeployment: every commit to main produces a unique, incrementing
# prerelease number (e.g. 0.2.0-preview0009, 0.2.0-preview0010), so each main
# commit can publish a distinct prerelease to the PowerShell Gallery. (Under
# ContinuousDelivery the number only advances on a version bump and the per-commit
# difference is build metadata, which the Gallery strips - causing version
# collisions.) A pushed v* tag still yields a clean stable version (e.g. 1.0.0).
mode: ContinuousDeployment
next-version: 0.1.0
major-version-bump-message: '(breaking\schange|breaking|major)\b'
minor-version-bump-message: '(adds?|features?|minor)\b'
patch-version-bump-message: '\s?(fix|patch)'
no-bump-message: '\+semver:\s?(none|skip)'
assembly-informational-format: '{NuGetVersionV2}+Sha.{Sha}.Date.{CommitDate}'
branches:
  master:
    tag: preview
    regex: ^main$
  pull-request:
    tag: PR
  feature:
    tag: useBranchName
    increment: Minor
    regex: f(eature(s)?)?[\/-]
    source-branches: ['master']
  hotfix:
    tag: fix
    increment: Patch
    regex: (hot)?fix(es)?[\/-]
    source-branches: ['master']
ignore:
  sha: []
merge-message-formats: {}
