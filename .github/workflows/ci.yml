# Continuous integration pipeline for DeskPilot.
#
# Mirrors ShellPilot's .github/workflows/ci.yml:
#   * Build  - calculate the version with GitVersion, build and package the
#              module, then publish the output/ folder as a build artifact.
#   * Test   - on Linux, Windows and macOS (PowerShell 7), reuse the build
#              artifact and run the Sampler test workflow.
#   * Smoke  - import the BUILT module and assert it exposes Start-DeskPilot.
#              Gates both deploy jobs. (A fuller /api/health server smoke
#              arrives once Phase B bundles web/ into the module - see
#              .memory-bank.)
#
# Release model (two trigger-split deploy jobs):
#   * publish_prerelease - on every push to main. GitVersion stamps a
#              -preview<N> version, so this publishes a PRERELEASE to the
#              PowerShell Gallery (installable with Install-Module -AllowPrerelease)
#              so users can see and test it. No GitHub release, no changelog cut.
#   * publish_release    - on a pushed version tag v* (e.g. v1.0.0). GitVersion
#              computes the clean stable version, so this publishes the FULL
#              release: GitHub release + stable Gallery module + a changelog PR
#              back to main.
#   Because main is configured as a prerelease branch in GitVersion.yml
#   (tag: preview), main is always a -preview build and a clean stable version
#   only ever comes from a v* tag - exactly the desired split.
#
#   BOTH jobs are GATED OFF until go-live (Phase D): they only run when the
#   repository variable PUBLISH_ENABLED is set to 'true'. DeskPilot is not yet
#   published to the Gallery (its ShellPilot dependency is still prerelease).
#   To go live: set the repo variable PUBLISH_ENABLED=true (Settings > Secrets
#   and variables > Actions > Variables) and add the secrets below. No code
#   change required.
#
# Required repository secrets (only used once publishing is enabled):
#   GitHubToken     - personal access token used to create the GitHub release
#                     and the changelog pull request (release job only).
#   GalleryApiToken - PowerShell Gallery API key used to publish the module
#                     (both prerelease and release jobs).
name: CI

run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || '' }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-*'
    paths-ignore:
      - CHANGELOG.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  buildArtifactName: output
  defaultBranch: main

jobs:
  build:
    name: Package Module
    runs-on: ubuntu-latest
    # Expose the GitVersion value to downstream jobs so they can show it in
    # their display names - the closest GitHub gets to Azure DevOps run renaming.
    outputs:
      fullSemVer: ${{ steps.gitversion.outputs.FullSemVer }}
      nuGetVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs the full history to calculate the version.
          fetch-depth: 0

      - name: Calculate ModuleVersion (GitVersion)
        id: gitversion
        shell: pwsh
        env:
          # GitVersion 5.x targets an older .NET; allow it to run on the
          # runner's newer shared framework.
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.*
          $env:PATH += [System.IO.Path]::PathSeparator + (Join-Path -Path $HOME -ChildPath '.dotnet/tools')
          $gitVersionObject = dotnet-gitversion | ConvertFrom-Json
          $gitVersionObject.PSObject.Properties.ForEach{
              Write-Host -Object "Setting output '$($_.Name)' with value '$($_.Value)'."
              "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          Write-Host -Object "ModuleVersion (FullSemVer): $($gitVersionObject.FullSemVer)"
          "## DeskPilot $($gitVersionObject.FullSemVer)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build & Package Module
        shell: pwsh
        env:
          ModuleVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
        run: ./build.ps1 -ResolveDependency -Tasks pack

      - name: Publish Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.buildArtifactName }}
          path: output/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test ${{ needs.build.outputs.fullSemVer }} (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.buildArtifactName }}
          path: output/

      - name: Run Tests
        shell: pwsh
        run: ./build.ps1 -Tasks test

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.os }}
          path: output/testResults/
          if-no-files-found: warn

  smoke:
    name: Smoke ${{ needs.build.outputs.fullSemVer }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.buildArtifactName }}
          path: output/

      - name: Import built module and verify the public surface
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path ./output/module/DeskPilot -Recurse -Filter DeskPilot.psd1 |
              Sort-Object -Property LastWriteTime -Descending |
              Select-Object -First 1
          if (-not $manifest) { throw 'Built DeskPilot manifest not found in the artifact.' }
          Write-Host -Object "Importing $($manifest.FullName)"
          Import-Module -Name $manifest.FullName -Force -ErrorAction Stop
          $command = Get-Command -Name Start-DeskPilot -Module DeskPilot -ErrorAction Stop
          if (-not $command) { throw 'Start-DeskPilot is not exported from the built module.' }
          Write-Host -Object 'OK: built module imports and exports Start-DeskPilot.'
          # A fuller smoke (start the Host Server, GET /api/health) lands in
          # Phase B, once web/ is bundled into the module and -WebRoot has a
          # module-relative default. See .memory-bank/activeContext.md.

  publish_prerelease:
    name: Publish prerelease ${{ needs.build.outputs.fullSemVer }} (Gallery)
    needs: [build, test, smoke]
    runs-on: ubuntu-latest
    # On every push to main. GitVersion makes main a -preview build, so this
    # publishes a PRERELEASE to the PowerShell Gallery for users to test with
    # Install-Module -AllowPrerelease. GATED OFF until go-live via PUBLISH_ENABLED.
    if: >-
      vars.PUBLISH_ENABLED == 'true' &&
      github.repository_owner == 'raandree' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.buildArtifactName }}
          path: output/

      - name: Publish prerelease to PowerShell Gallery
        shell: pwsh
        env:
          GalleryApiToken: ${{ secrets.GalleryApiToken }}
        run: ./build.ps1 -Tasks publish_module_to_gallery

  publish_release:
    name: Publish release ${{ needs.build.outputs.fullSemVer }}
    needs: [build, test, smoke]
    runs-on: ubuntu-latest
    # On a pushed version tag (e.g. v1.0.0). GitVersion computes the clean stable
    # version, so this publishes the FULL release: GitHub release + stable Gallery
    # module + a changelog PR back to main. GATED OFF until go-live via PUBLISH_ENABLED.
    if: >-
      vars.PUBLISH_ENABLED == 'true' &&
      github.repository_owner == 'raandree' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.buildArtifactName }}
          path: output/

      - name: Publish Release (GitHub release + PowerShell Gallery)
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          GalleryApiToken: ${{ secrets.GalleryApiToken }}
          ReleaseBranch: ${{ env.defaultBranch }}
          MainGitBranch: ${{ env.defaultBranch }}
        run: ./build.ps1 -Tasks publish

      - name: Send Changelog PR
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          ReleaseBranch: ${{ env.defaultBranch }}
          MainGitBranch: ${{ env.defaultBranch }}
        run: ./build.ps1 -Tasks Create_ChangeLog_GitHub_PR
